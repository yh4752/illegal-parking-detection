groups:
  - name: parking-operations
    rules:
      - alert: ParkingBackendDown
        expr: up{job="parking"} == 0
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Backend metrics unavailable; check process and scrape authentication'}
      - alert: ParkingReadNotReady
        expr: parking_readiness_ready{job="parking"} == 0
        labels: {severity: critical}
        annotations: {summary: 'Database or revision gate is not ready for reads'}
      - alert: ParkingMqttDisconnected
        expr: parking_mqtt_connected{job="parking"} == 0
        for: 30s
        labels: {severity: warning}
        annotations: {summary: 'MQTT channel disconnected; stored reads can remain available'}
      - alert: ParkingCommitFailures
        expr: increase(parking_commit_failures_total{job="parking"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'Event database processing failed; no successful application ACK for that attempt'}
      - alert: ParkingAckFailures
        expr: increase(parking_ack_publish_total{job="parking",result="failure"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'ACK publication failed after commit; inspect device retry and duplicate outcomes'}
      - alert: ParkingIngestRejectRatio
        expr: |
          (sum by (job, instance) (rate(parking_ingest_total{job="parking",outcome=~"rejected|not_acknowledged"}[5m]))
            / sum by (job, instance) (rate(parking_ingest_total{job="parking"}[5m])) > 0.2)
          and sum by (job, instance) (increase(parking_ingest_total{job="parking"}[5m])) >= 20
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'More than 20 percent rejected with at least 20 event attempts in five minutes'}
      - alert: ParkingSlowCommit
        expr: |
          histogram_quantile(0.95, sum by (job, instance, le) (rate(parking_ingest_commit_seconds_bucket{job="parking"}[5m]))) > 1
          and sum by (job, instance) (increase(parking_ingest_commit_seconds_count{job="parking"}[5m])) >= 20
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Commit path p95 above one second with at least 20 completed transactions'}
      - alert: ParkingSsePressure
        expr: |
          parking_sse_active{job="parking"} >= 40
          or increase(parking_sse_rejected_total{job="parking"}[5m]) > 0
          or increase(parking_sse_slow_closed_total{job="parking"}[5m]) > 0
        labels: {severity: warning}
        annotations: {summary: 'SSE capacity or slow client closure; compare active connections and rejection counters'}
      - alert: ParkingDiskSpaceWarning
        expr: 1 - node_filesystem_avail_bytes{job="linux-runtime",mountpoint="/"} / node_filesystem_size_bytes{job="linux-runtime",mountpoint="/"} >= 0.8
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Observed Docker runtime filesystem at least 80 percent used'}
      - alert: ParkingDiskSpaceCritical
        expr: 1 - node_filesystem_avail_bytes{job="linux-runtime",mountpoint="/"} / node_filesystem_size_bytes{job="linux-runtime",mountpoint="/"} >= 0.9
        for: 1m
        labels: {severity: critical}
        annotations: {summary: 'Observed Docker runtime filesystem at least 90 percent used'}
      - alert: ParkingInodesLow
        expr: node_filesystem_files_free{job="linux-runtime",mountpoint="/"} / node_filesystem_files{job="linux-runtime",mountpoint="/"} < 0.1
        for: 1m
        labels: {severity: warning}
        annotations: {summary: 'Observed Docker runtime filesystem has less than 10 percent free inodes'}
      - alert: ParkingHttpsInternalDown
        expr: probe_success{job="https-internal"} == 0
        for: 30s
        labels: {severity: warning}
        annotations: {summary: 'Internal HTTPS probe failed; this does not test external reachability'}
      - alert: ParkingCertificateExpiring
        expr: (probe_ssl_earliest_cert_expiry{job="https-internal"} - time()) / 86400 < 14 and probe_success{job="https-internal"} == 1
        labels: {severity: warning}
        annotations: {summary: 'HTTPS certificate expires within 14 days; short local certificates intentionally trigger this warning'}
