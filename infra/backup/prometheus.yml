global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml, /etc/backup/alerts.yml]
scrape_configs:
  - job_name: parking
    metrics_path: /actuator/prometheus
    basic_auth:
      username: prometheus
      password_file: /run/secrets/monitoring-password
    static_configs:
      - targets: [backend:9091]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: linux-runtime
    static_configs:
      - targets: [node-exporter:9100]
        labels: {scope: docker-runtime}
  - job_name: https-internal
    metrics_path: /probe
    params: {module: [parking_https]}
    static_configs:
      - targets: ['https://web:443/api/csrf']
        labels: {scope: internal-only}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {target_label: instance, replacement: parking-https}
      - {target_label: __address__, replacement: 'blackbox:9115'}
