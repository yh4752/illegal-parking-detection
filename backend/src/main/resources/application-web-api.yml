# Authenticated read API only. MQTT transport is enabled separately; same process shares the revision gate.
server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: true
parking:
  revision:
    primary: ${PARKING_REVISION_PRIMARY:../.local-state/revisions/revision-reservations.json}
    backup: ${PARKING_REVISION_BACKUP:../.local-state/revisions-copy/revision-reservations.json}
