spring:
  application:
    name: parking-backend
  profiles:
    group:
      mqtt-validation-local:
        - database
      mqtt-ingest-local:
        - database

server:
  address: 127.0.0.1
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# DB 없이 기동하거나 MQTT만 학습할 때는 DB 자동 설정을 적용하지 않는다.
# database 프로필에서는 Spring Boot의 표준 JDBC/Flyway 자동 설정을 사용한다.
spring:
  config:
    activate:
      on-profile: "!database"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
