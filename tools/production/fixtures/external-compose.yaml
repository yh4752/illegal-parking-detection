# TEST ONLY. Loopback S3 emulator; no real AWS credentials, accounts or buckets.
services:
  s3-test:
    image: ${PARKING_LEDGER_IMAGE:?}
    entrypoint: [moto_server, -H, 0.0.0.0, -p, '5000']
    ports: ['127.0.0.1:${PARKING_TEST_S3_PORT:?}:5000']
    networks: [ledger, test-storage-ui]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    mem_limit: 256m
  revision-ledger:
    command: [serve]
    environment: {PARKING_TEST_STORE_ID: '${PARKING_LEDGER_ID:?}'}
    depends_on: [s3-test]
  backend:
    environment:
      PARKING_REVISION_LEDGER_SCOPE: AWS_S3
      PARKING_BACKUP_STATUS_FILE: /backup-status/last-success.json
  initialize-local:
    environment: {PARKING_REVISION_LEDGER_SCOPE: AWS_S3}
  recovery:
    environment: {PARKING_REVISION_LEDGER_SCOPE: AWS_S3}
networks:
  test-storage-ui: {}
