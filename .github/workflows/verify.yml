name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documents and local configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python3 tools/check_structure.py
      - run: python3 tools/build_contracts.py --check
      - run: python3 -m unittest discover -s tools/tests -v
      - run: pip install -r tools/production/requirements-external-test.txt
      - run: python3 -m unittest discover -s tools/production -p 'test_*.py' -v
      - run: python3 tools/production/verify_external_local.py
      - run: python3 tools/production/verify_external_postgres.py
      - run: npm --prefix tools/docs ci
      - run: npm --prefix tools/docs run build
      - name: Require updated generated documentation
        run: git diff --exit-code -- docs
      - name: Validate Compose configuration only
        working-directory: infra
        run: docker compose --env-file .env.example config --quiet

  backend:
    name: Backend tests, PostgreSQL migration and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_DB: parking
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U parking -d parking"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Unit tests and package application (file-secret fixtures)
        working-directory: backend
        run: bash ./gradlew test bootJar --no-daemon
      - name: Database migration and constraints
        working-directory: backend
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: bash ./gradlew databaseTest --no-daemon

  frontend:
    name: Frontend contract, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.13.0', package-manager-cache: false}
      - run: npm ci
        working-directory: frontend
      - run: npm run generate && npm run format:check && npm test && npm run build
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/api/generated
      - run: pip install -r simulator/requirements.txt
      - run: python -m unittest discover -s simulator -v

  handoff:
    name: Fresh clone Docker and real browser handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.13.0', package-manager-cache: false}
      - run: python3 tools/handoff.py prepare
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - name: Broker, DB and restart recovery
        run: python3 tools/verify_handoff_transport.py
      - name: Container logs on failure (no environment dump)
        if: failure()
        run: python3 tools/handoff.py logs
      - name: Browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: handoff-browser-evidence
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - name: Stop only this handoff stack
        if: always()
        run: python3 tools/handoff.py stop

  production-boundaries:
    name: Production TLS, ACL and DB role isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: pip install -r simulator/requirements.txt
      - run: python3 tools/production/verify_o1.py

  production-https:
    name: Local HTTPS, Nginx recovery and real browser
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.13.0', package-manager-cache: false}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python3 tools/production/verify_o2.py
      - name: HTTPS browser evidence (no credential traces)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-https-browser-evidence
          path: output/playwright/
          retention-days: 7

  production-monitoring:
    name: Local metrics, actual faults, alerts and Grafana browser
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '24.13.0', package-manager-cache: false}
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python3 tools/production/verify_o3.py
      - name: Grafana browser evidence (no credential traces)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-monitoring-browser-evidence
          path: output/playwright/
          retention-days: 7

  production-backup:
    name: Local encrypted backup, independent revision and restore acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - run: pip install -r tools/production/requirements-external-test.txt
      - run: python3 tools/production/verify_o4.py
      - name: Full product stack with local S3 adapter and age recovery
        run: python3 tools/production/verify_external_stack.py
      - name: Restore evidence without credentials or database archives
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: local-backup-evidence
          path: |
            .local-state/o4-last-result.json
            .local-state/external-full-stack-result.json
          retention-days: 7
