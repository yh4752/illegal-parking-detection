name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Documents and local configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: python3 tools/check_structure.py
      - run: npm --prefix tools/docs ci
      - run: npm --prefix tools/docs run build
      - name: Require updated generated documentation
        run: git diff --exit-code -- docs
      - name: Validate Compose configuration only
        working-directory: infra
        run: docker compose --env-file .env.example config --quiet

  backend:
    name: Backend tests, PostgreSQL migration and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
        env:
          POSTGRES_DB: parking
          POSTGRES_USER: parking
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U parking -d parking"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Test migration, constraints and package application
        working-directory: backend
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: bash ./gradlew test databaseTest bootJar --no-daemon
